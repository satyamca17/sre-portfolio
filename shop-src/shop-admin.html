<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Shop admin | PickSmart</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#0f1f3d;--mute:#5f6b82;--line:#dfe3ec;--acc:#0f1f3d;--or:#f59e2b;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--acc)}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.hd{max-width:1000px;margin:0 auto;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hd b{font-size:18px}.sp{flex:1}
main{max-width:1000px;margin:0 auto;padding:14px 14px 80px}
@media print{header,.tabs,#cprint,[data-cs],[data-cp]{display:none!important}}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tab,.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer;color:var(--ink)}.tab.on,.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}.chip{padding:6px 12px;font-size:14px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.k{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:#eceafd;color:var(--acc)}.k.new{background:#fde6c0;color:#7a3d00}.k.paid_claimed{background:#fff3d6;color:#7a5a00}.k.delivered{background:#d9f2e0;color:var(--ok)}.k.returned{background:#fde0e0;color:var(--bad)}.k.refunded,.k.cancelled{background:#fde0e0;color:var(--bad)}
.mute{color:var(--mute);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{min-width:0}
label{display:block;font-size:13px;font-weight:600;margin:8px 0 3px}input,textarea,select{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}textarea{min-height:60px}
.btn{border:0;border-radius:9px;padding:8px 14px;font:inherit;font-weight:700;background:var(--or);color:#1c1f3a;cursor:pointer;text-decoration:none;display:inline-block}.btn.s{background:#fff;border:1px solid var(--acc);color:var(--acc)}.btn.d{background:#fff;border:1px solid var(--bad);color:var(--bad)}.btn.w{background:#25d366;color:#fff}.btn[disabled]{opacity:.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}@media(min-width:700px){.gp .w2{grid-column:span 2}}.gp .wf{grid-column:1/-1}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}.chips label{position:relative;margin:0;display:inline-flex;padding:0;cursor:pointer}.chips input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}.chips span{display:inline-block;padding:7px 13px;border:1.5px solid #c9cfda;border-radius:999px;font-weight:600;font-size:14px;line-height:1.2;background:#fff;color:inherit}.chips label.on span{background:var(--acc,#3a3fb8);border-color:var(--acc,#3a3fb8);color:#fff}.chips input:focus-visible+span{outline:3px solid #f59e2b;outline-offset:2px}.gp{align-items:end}.gp .ah{align-self:start} .chips.pk{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}.chips.pk label{position:relative;margin:0;display:inline-flex;padding:0;cursor:pointer}.chips.pk input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}.chips.pk span{display:inline-block;padding:7px 13px;border:1.5px solid #c9cfda;border-radius:999px;font-weight:600;font-size:14px;line-height:1.2;background:#fff;color:inherit}.chips.pk label.on span{background:var(--acc,#3a3fb8);border-color:var(--acc,#3a3fb8);color:#fff}.chips.pk input:focus-visible+span{outline:3px solid #f59e2b;outline-offset:2px}.gp{align-items:end}textarea.wr{resize:none;overflow:hidden;min-height:44px;line-height:1.35;overflow-wrap:anywhere}@media(max-width:560px){.g2{grid-template-columns:1fr}}
.th{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.tm{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#eee;display:grid;place-items:center;font-size:24px}.tm img{width:100%;height:100%;object-fit:cover}.tm .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1}.tm .f{position:absolute;left:2px;bottom:2px;border:0;border-radius:6px;background:rgba(255,255,255,.9);font-size:11px;padding:2px 6px;cursor:pointer}
.pl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pl .tm{flex:none;width:56px;height:56px;font-size:18px}
.ok{color:var(--ok)}.er{color:var(--bad);white-space:pre-line}
header{background:#0f1f3d!important;border-bottom:0!important}header,header b,header a,header .mute{color:#fff!important}header i{font-style:normal;color:#f59e2b}
.emb header,.emb .tabs{display:none!important}.emb main{padding-top:8px}
</style></head><body>
<script>if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add("emb")</script>
<header><div class="hd"><b>pick-smart<i>.in</i> · Shop admin</b><a href="/shop">View shop</a><a href="/shop/console">New admin view</a><span class="sp"></span><span id="mode" class="mute"></span></div></header>
<main>
<div class="tabs"><button class="tab on" data-t="o">Orders</button><button class="tab" data-t="p">Products</button><button class="tab" data-t="x">Upload spreadsheet</button><button class="tab" data-t="m">Upload photos &amp; videos</button><button class="tab" data-t="c">Checklist</button><button class="tab" data-t="y">Pay shops</button><button class="tab" data-t="r">Reviews</button><button class="tab" data-t="g">Pricing</button><button class="tab" data-t="k">Coupons</button><button class="tab" data-t="q">Reports <span id="rpn"></span></button><button class="tab" data-t="u">Customers</button><button class="tab" data-t="w">Shop requests <span id="srn"></span></button><button class="tab" data-t="s">Shop owners</button><button class="tab" data-t="n">Banners</button><button class="tab" data-t="b">Backup &amp; restore</button></div>
<section id="o"></section><section id="p" hidden></section><section id="x" hidden></section><section id="m" hidden></section><section id="s" hidden></section><section id="w" hidden></section><section id="c" hidden></section><section id="y" hidden></section><section id="r" hidden></section><section id="g" hidden></section><section id="k" hidden></section><section id="q" hidden></section><section id="u" hidden></section><section id="n" hidden></section><section id="b" hidden></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mg=(sell,cost)=>{sell=+sell||0;cost=cost==null||cost===""?sell:+cost||0;const m=sell-cost;return{m,pc:sell?Math.round(m/sell*100):0}};
const mgTxt=(sell,cost)=>{const{m,pc}=mg(sell,cost);return `<span class="${m<0?"er":m>0?"ok":"mute"}">You keep ${inr(m)} per item (${pc}%)</span>`};
const inr=n=>"₹"+Number(n||0).toLocaleString("en-IN");
const itOf=o=>`${o.title}${o.option?" ("+o.option+")":""} x${o.qty}`,shopMsg=o=>`PickSmart order ${o.code}\nPlease pack: ${itOf(o)}\nA delivery rider will collect it. Please keep it ready.`;
const jf=async(u,o)=>{const r=await fetch(u,o),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Something went wrong ("+r.status+")");return j};
const allProducts=async()=>{const r=await fetch("/api/shop/admin/products?limit=1000"),j=await r.json().catch(()=>[]);return Array.isArray(j)?j:[]};
const post=(u,b)=>jf(u,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)});
document.addEventListener("click",e=>{const t=e.target.closest("#psr,#pcl,#plow,#osr,#ocl,#omore");if(!t)return;
 if(t.id==="psr"){PQ=$("#pq").value.trim();products()}else if(t.id==="pcl"){PQ="";products()}else if(t.id==="plow"){LOWF=!LOWF;products()}
 else if(t.id==="osr"){OQ=$("#oq").value.trim();OFR=$("#ofr").value;OTO=$("#oto").value;OLIM=100;orders()}
 else if(t.id==="ocl"){OQ=OFR=OTO="";OLIM=100;orders()}else if(t.id==="omore"){OLIM=Math.min(300,OLIM+100);orders()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="oq"||e.target.id==="pq")){e.preventDefault();$(e.target.id==="oq"?"#osr":"#psr").click()}});
let CFG={},PRODS=[],SET={ctype:"percent",cval:20,fee:0,free:0,ccost:0};
const custP=x=>{x=+x||0;return x>0?Math.ceil(SET.ctype==="fixed"?x+SET.cval:x*(1+SET.cval/100)-1e-9):0};
const discPc=(m,p)=>m>p&&p>0?Math.round((m-p)*100/m):0;
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));["o","p","x","m","s","w","c","y","r","q","u","g","k","n","b"].forEach(k=>$("#"+k).hidden=k!==t.dataset.t);({o:orders,c:checklist,p:products,x:sheet,m:bulkMedia,s:owners,w:sellreqs,y:payouts,r:revs,q:reports,u:customers,g:pricing,k:coupons,n:banners,b:backup})[t.dataset.t]()});
const SL={new:"Waiting for payment",paid_claimed:"Customer says paid",paid:"Paid, ready to dispatch",packed:"Paid, shop has packed it",shop_called:"Dispatched",delivered:"Delivered",returned:"Returned by customer",refunded:"Refunded",cancelled:"Cancelled"};
let OF="paid",SKO=false,SD=30,ORD=[],OQ="",OFR="",OTO="",OLIM=100,PQ="",PTOT=0;const oqs=()=>new URLSearchParams({...(OF?{status:OF}:{}),...(OQ?{q:OQ}:{}),...(OFR?{from:OFR}:{}),...(OTO?{to:OTO}:{}),limit:OLIM}).toString();
const keepOf=o=>{const sp=o.shop_price!=null?o.shop_price:o.price,base=(o.price-sp)*o.qty-(o.discount||0)+o.fee-(o.courier_cost||0);if(!o.refund_amount)return base;const shop=(o.status==="delivered"||o.shop_paid)?sp*o.qty:0;return o.amount-o.refund_amount-shop-(o.courier_cost||0)};
/* Daily checklist: each paid order goes pack -> call rider -> deliver. Shows what the shop and the rider need. */
async function checklist(){const s=$("#c");s.innerHTML='<p class="mute">Loading…</p>';
 try{let all=[];for(const st of["paid","packed","shop_called"])all=all.concat((await jf("/api/shop/admin/orders?status="+st)).orders);
  const G={};all.forEach(o=>{const k=o.grp||o.code;(G[k]=G[k]||[]).push(o)});const keys=Object.keys(G).sort();
  const step=(done,t)=>`<span style="display:inline-block;margin-right:10px">${done?"✅":"⬜"} ${t}</span>`;
  const msg=(k,ls)=>{const o=ls[0];return `PickSmart order ${k}\nPICK UP: ${o.pname||o.shop_name||"Shop"}${o.saddr?", "+o.saddr:""}${o.sarea?", "+o.sarea:""}${o.sphone?" ("+o.sphone+")":""}${o.smaps?"\nMap: "+o.smaps:""}\nITEMS: ${ls.map(itOf).join(", ")}\nDELIVER TO: ${o.name}, ${o.address}, ${o.pincode}\nCustomer phone: ${o.phone}\nNo payment to collect (paid online).`};
  s.innerHTML=`<div class="row"><b>Orders to dispatch and deliver (${keys.length})</b><button class="chip" id="cprint">Print</button></div>`+(keys.length?keys.map(k=>{const ls=G[k],o=ls[0],st=ls.every(x=>x.status==="shop_called")?"shop_called":ls.every(x=>x.status!=="paid")?"packed":"paid";
   return `<div class="box"><div class="row"><b>${esc(k)}</b><span class="mute">${esc(o.pname||o.shop_name||"Shop")}${o.sphone?" · "+esc(o.sphone):""}</span></div>
   <div style="margin:6px 0">${step(1,"Paid")}${step(st==="shop_called","Dispatched")}${step(0,"Delivered")}${st==="packed"&&o.shop_name?'<span class="mute">· shop says packed</span>':""}</div>
   <div class="mute">Pick up: ${esc([o.saddr,o.sarea,o.spin].filter(Boolean).join(", ")||"shop address not set")}${o.smaps?` · <a href="${esc(o.smaps)}" target="_blank" rel="noopener">Map</a>`:""}</div>
   <div style="margin:4px 0">${ls.map(x=>esc(itOf(x))).join("<br>")}</div>
   <div class="mute">Deliver to: ${esc(o.name)}, ${esc(o.address)}, ${esc(o.pincode)} · ${esc(o.phone)}</div>
   ${st!=="shop_called"?`<div class="g2" style="margin-top:8px"><input data-cdn="${esc(k)}" maxlength="80" placeholder="Delivery person / company" value="${esc(o.delivery_name||"")}"><input data-ctn="${esc(k)}" maxlength="60" placeholder="Tracking number (optional)" value="${esc(o.tracking_no||"")}"></div><input data-ctu="${esc(k)}" maxlength="400" placeholder="Tracking link (optional)" style="margin-top:4px" value="${esc(o.track_url||"")}">`:""}<div class="row" style="margin-top:8px;justify-content:flex-start;gap:8px;flex-wrap:wrap">${st!=="shop_called"?`<button class="chip on" data-cs="shop_called" data-k="${esc(k)}">Mark dispatched (emails the customer)</button>`:""}<button class="chip ${st==="shop_called"?"on":""}" data-cs="delivered" data-k="${esc(k)}">Mark delivered (emails the customer)</button><button class="chip" data-cp="${esc(k)}">Copy rider message</button></div></div>`}).join(""):'<div class="box"><p class="mute">Nothing waiting. New paid orders appear here.</p></div>');
  $("#cprint").onclick=()=>window.print();
  s.querySelectorAll("[data-cs]").forEach(b=>b.onclick=async()=>{b.disabled=true;const o=G[b.dataset.k][0];try{const q=n=>{const e=s.querySelector('[data-'+n+'="'+b.dataset.k+'"]');return e?e.value:undefined};await post("/api/shop/admin/order",{id:o.id,status:b.dataset.cs,note:o.note||"",shop_paid:o.shop_paid,delivery_name:q("cdn"),tracking_no:q("ctn"),track_url:q("ctu")});checklist()}catch(e){alert(e.message);b.disabled=false}});
  s.querySelectorAll("[data-cp]").forEach(b=>b.onclick=async()=>{const t=msg(b.dataset.cp,G[b.dataset.cp]);try{await navigator.clipboard.writeText(t);b.textContent="Copied"}catch(e){prompt("Copy this message",t)}})
 }catch(e){s.innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
async function orders(){const s=$("#o");s.innerHTML='<p class="mute">Loading…</p>';
 try{const d=await jf("/api/shop/admin/orders?"+oqs()),cnt=Object.fromEntries(d.counts.map(c=>[c.status,c.n]));
  let sm=null;try{sm=await jf("/api/shop/admin/summary?days="+SD)}catch(e){}
  s.innerHTML=(sm?`<div class="box"><div class="row"><b>What you keep</b><span class="mute">${inr(sm.keep)} kept · ${sm.orders} delivered</span><button class="chip" id="skt">${SKO?"Hide ▴":"Show ▾"}</button></div>${SKO?`<div class="row" style="margin-top:6px"><select id="sdays" style="width:auto"><option value="30"${SD===30?" selected":""}>Last 30 days</option><option value="7"${SD===7?" selected":""}>Last 7 days</option><option value="0"${SD===0?" selected":""}>All time</option></select></div><div class="g2" style="margin-top:6px"><div class="mute">Customers paid for items<br><b style="color:var(--ink);font-size:17px">${inr(sm.customerItems)}</b></div><div class="mute">Shops get<br><b style="color:var(--ink);font-size:17px">${inr(sm.shopGets)}</b></div>${sm.refunds?`<div class="mute">Refunds sent<br><b style="color:var(--ink);font-size:17px">− ${inr(sm.refunds)}</b></div>`:""}${sm.discounts?`<div class="mute">Coupons given<br><b style="color:var(--ink);font-size:17px">− ${inr(sm.discounts)}</b></div>`:""}<div class="mute">Your margin on items<br><b style="color:var(--ink);font-size:17px">${inr(sm.margin)}</b></div><div class="mute">Delivery fees collected<br><b style="color:var(--ink);font-size:17px">${inr(sm.fees)}</b></div><div class="mute">Courier paid by you<br><b style="color:var(--ink);font-size:17px">− ${inr(sm.courier)}</b></div><div class="mute">You keep<br><b class="${sm.keep<0?"er":"ok"}" style="font-size:20px">${inr(sm.keep)}</b></div></div>${sm.owed.length?`<p class="mute" style="margin:8px 0 0"><b>You owe shops (delivered, not yet paid):</b> ${sm.owed.map(w=>esc(w.name||"Shop")+" "+inr(w.amt)+" ("+w.n+" orders)").join(" · ")}</p>`:""}${sm.pending?`<p class="mute" style="margin:4px 0 0">${sm.pending} product${sm.pending>1?"s":""} waiting for approval in the Products tab.</p>`:""}`:""}</div>`:"")+`<div class="row" style="margin-bottom:8px"><button class="chip${OF?"":" on"}" data-f="">All</button>${Object.keys(SL).filter(k=>k!=="new"&&k!=="paid_claimed").map(k=>`<button class="chip${OF===k?" on":""}" data-f="${k}">${SL[k]}${cnt[k]?" ("+cnt[k]+")":""}</button>`).join("")}</div>
  <div class="box"><div class="row" style="gap:6px;flex-wrap:wrap"><input id="oq" placeholder="Search order no, phone, name, item" value="${esc(OQ)}" style="flex:1;min-width:180px"><label class="mute" style="margin:0">From <input id="ofr" type="date" value="${esc(OFR)}" style="width:auto"></label><label class="mute" style="margin:0">To <input id="oto" type="date" value="${esc(OTO)}" style="width:auto"></label><button class="chip on" id="osr">Search</button>${OQ||OFR||OTO?'<button class="chip" id="ocl">Clear</button>':""}</div>
  <div class="row" style="margin-top:6px;gap:8px;flex-wrap:wrap"><span class="mute">Showing ${d.orders.length} of ${d.total} orders${d.total>d.orders.length&&OLIM>=300?". Use search or dates to find older ones":""}</span><a class="chip" download href="/api/shop/admin/export?kind=orders${OFR?"&from="+OFR:""}${OTO?"&to="+OTO:""}${OF?"&status="+OF:""}">Download these dates (Excel/CSV)</a></div></div>
  ${d.orders.length?d.orders.map(o=>`<div class="box" data-id="${o.id}"><div class="row"><b>${esc(o.code)}</b>${o.grp?` <span class="k paid">Cart ${esc(o.grp)} · ${d.orders.filter(x=>x.grp===o.grp).length} items · total ${inr(d.orders.filter(x=>x.grp===o.grp).reduce((t,x)=>t+x.amount,0))}</span>`:""}${o.shop_name?`<span class="mute">Shop: ${esc(o.shop_name)}</span>`:""}<span class="k ${o.status}">${SL[o.status]||o.status}</span><span class="sp mute" style="flex:1;text-align:right">${new Date(o.created_at).toLocaleString("en-IN")}</span></div>
  <p style="margin:6px 0"><b>${esc(o.title)}</b>${o.option?" ("+esc(o.option)+")":""} × ${o.qty} · <b>${inr(o.amount)}</b>${o.fee?` <span class="mute">(incl. delivery ${inr(o.fee)})</span>`:""}${o.upi_ref?`<br><span class="mute">UPI ref:</span> <b>${esc(o.upi_ref)}</b>`:""}${["new","paid_claimed"].includes(o.status)?`<div class="row" style="margin:6px 0"><label class="btn s" style="margin:0;cursor:pointer;display:inline-block">${o.proofs&&o.proofs.length?"Replace screenshot":"Add screenshot from email / WhatsApp"}<input type="file" data-pf accept=".jpg,.jpeg,.png,image/jpeg,image/png" hidden></label>${o.proofs&&o.proofs.length?`<button class="btn d" data-pdel="${o.proofs[0].id}">Delete screenshot</button>`:""}<span class="mute" data-pm2></span></div>`:""}${o.proofs&&o.proofs.length?`<div style="margin:6px 0;background:#f0f9ff;border:1px solid #bfe3f7;border-radius:10px;padding:8px"><b>Payment screenshot</b> <span class="mute">${esc(o.code+"_U"+(o.user_id||"guest")+"_Rs"+o.amount+(o.sku?"_"+o.sku:""))}</span><div class="row" style="margin-top:6px">${o.proofs.map((x,n)=>`<a href="/api/shop/admin/proof?id=${x.id}" target="_blank" rel="noopener" style="display:block">${x.ct==="application/pdf"?`<span class="btn s" style="display:inline-block">PDF ${n+1}</span>`:`<img src="/api/shop/admin/proof?id=${x.id}" alt="Payment screenshot ${n+1}" style="width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)">`}</a>`).join("")}</div><div class="mute" style="margin-top:4px">Order ${esc(o.code)} · Customer ID ${o.user_id?"U"+o.user_id:"guest (no account)"} · Amount to receive <b>${inr(o.amount)}</b><br>Tap the image to open or download. Check this amount in your UPI app before you confirm.</div></div>`:o.status==="paid_claimed"?`<br><b style="color:#7a3d00">Customer says paid, no screenshot.</b>`:""}</p>

 ${OWN.length?OWN.map(w=>`<div class="box" data-w="${w.id}"><div class="row"><b style="flex:1">${esc(w.shop_name||w.name||"")} <span class="k">Shop ID ${sc(w.id)}</span>${w.disabled?' <span class="k returned">Switched off</span>':""}<br><span class="mute">${esc(w.email)} · ${PRODS.filter(p=>p.owner_id===w.id).length} products</span></b><button class="btn s" data-ed>Shop details</button><button class="btn ${w.disabled?"":"s"}" data-dis="${w.id}" data-v="${w.disabled?0:1}">${w.disabled?"Switch shop on":"Switch shop off"}</button><button class="btn d" data-dp="${w.id}">Delete all products</button><button class="btn d" data-r="${w.id}">Remove owner</button></div>

async function sheet(){try{await load()}catch(e){}$("#x").innerHTML=`<div class="box"><b>Download all products to Excel</b><p class="mute">Gives you every product with the <b>shop price</b> (what the shop gets), your <b>price</b> (what customers pay) and how much you keep. Change the <b>price</b> column, then upload the same file below.</p><div class="row"><select id="dlf" style="width:auto"><option value="">All shops</option><option value="own">PickSmart own stock</option>${OWN.map(w=>`<option value="${w.id}">${sc(w.id)} ${esc(w.shop_name||w.name||"")}</option>`).join("")}</select><button class="btn s" id="dlb">Download Excel</button></div></div><div class="box"><b>Upload your product spreadsheet</b><p class="mute">Use the template file <b>shop-products-template.xlsx</b> (Excel). Fill one row per product and upload it here. A row with a product code (SKU) that already exists updates that product, so you can use the same file to change prices later. Photos and videos are added in the next tab.</p>
 <input type="file" id="xf" accept=".xlsx,.xls,.csv"><div id="xr"></div></div>`;
 $("#dlb").onclick=dlProducts;
 $("#xf").onchange=async e=>{const f=e.target.files[0];if(!f)return;const r=$("#xr");r.innerHTML='<p class="mute">Reading file…</p>';
  try{if(!window.XLSX)throw new Error("Could not load the spreadsheet reader. Check your internet and reload.");
   const wb=XLSX.read(await f.arrayBuffer(),{type:"array"}),ws=wb.Sheets[wb.SheetNames.find(n=>/product/i.test(n))||wb.SheetNames[0]];
   let rows=XLSX.utils.sheet_to_json(ws,{defval:"",raw:false});
   const norm=k=>String(k).toLowerCase().replace(/[^a-z]/g,"");const map={sku:"sku",productcode:"sku",code:"sku",title:"title",name:"title",productname:"title",category:"category",price:"price",sellingprice:"price",picksmartprice:"price",customerprice:"price",mrp:"mrp",options:"options",sizes:"options",sizesoptions:"options",returns:"returns",returnallowed:"returns",description:"description",active:"active",show:"active",showinshop:"active",shopemail:"shop_email",shop:"shop_email",shopid:"shop_id",shopprice:"shop_price",shopcost:"shop_price",cost:"shop_price",shopmrp:"shop_mrp",ownermrp:"shop_mrp"};
   rows=rows.map(o=>{const n={};for(const k in o){const m=map[norm(k)];if(m)n[m]=o[k]}return n}).filter(o=>o.title||o.price||o.shop_price);
   rows.forEach(o=>{o.price=String(o.price).replace(/[^\d.]/g,"");o.mrp=String(o.mrp||"").replace(/[^\d.]/g,"");o.shop_price=String(o.shop_price||"").replace(/[^\d.]/g,"");o.shop_mrp=String(o.shop_mrp||"").replace(/[^\d.]/g,"");if(o.price==="undefined")o.price=""});
   if(!rows.length)throw new Error("No product rows found. Use the template and fill the product name and price columns.");
   r.innerHTML=`<p><b>${rows.length}</b> products found.</p><div class="mute">${rows.slice(0,5).map(o=>esc(o.title)+" · "+(o.price?"₹"+esc(o.price):o.shop_price?"shop ₹"+esc(o.shop_price)+" (price added from your commission)":"no price")).join("<br>")}${rows.length>5?"<br>…":""}</div><button class="btn" id="xgo" style="margin-top:8px">Import ${rows.length} products</button><p id="xm"></p>`;
   $("#xgo").onclick=async()=>{const b=$("#xgo");b.disabled=true;try{let a=0,u=0,sk=[];for(let i=0;i<rows.length;i+=100){const d=await post("/api/shop/admin/import",{rows:rows.slice(i,i+100)});a+=d.added;u+=d.updated;sk=sk.concat(d.skipped||[])}
     $("#xm").innerHTML=`<span class="ok">Added ${a}, updated ${u}.</span>`+(sk.length?`<br><span class="er">Skipped:\n${esc(sk.join("\n"))}</span>`:"")+`<br>Next: open <b>Upload photos &amp; videos</b>.`}catch(x){$("#xm").innerHTML='<span class="er">'+esc(x.message)+"</span>";b.disabled=false}}}
  catch(x){r.innerHTML='<p class="er">'+esc(x.message)+"</p>"}}}

async function pricing(){const s=$("#g");try{SET=await jf("/api/shop/admin/settings")}catch(e){s.innerHTML='<p class="er">'+esc(e.message)+"</p>";return}
 s.innerHTML=`
<div class="box"><b>Your commission</b><p class="mute">Added on top of the shop's price and the shop's MRP. Customers see the new price, the new MRP and the discount between them. Shop owners never see it.</p>
 <div class="row"><label style="margin:0"><input type="radio" name="ct" value="percent" style="width:auto"${SET.ctype!=="fixed"?" checked":""}> Percentage (%)</label><label style="margin:0"><input type="radio" name="ct" value="fixed" style="width:auto"${SET.ctype==="fixed"?" checked":""}> Fixed rupees (₹ per item)</label></div>
 <div class="row" style="margin-top:8px"><input id="gv" type="number" min="0" step="any" value="${SET.cval}" style="width:110px"><span class="mute" id="gu"></span></div><div id="gex" class="box" style="background:#f4f8ff;margin:8px 0"></div></div>
 <div class="box"><b>Courier charges</b><p class="mute">What the customer pays for delivery, when it is free, and what is kept from a refund when a customer returns an item for change of mind. Wrong, damaged or missing items are always refunded in full.</p>
 <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:420px">
 <tr style="text-align:left;font-size:13px"><th style="padding:6px 4px">Area</th><th style="padding:6px 4px">Customer pays (₹)</th><th style="padding:6px 4px">Free above (₹)</th><th style="padding:6px 4px">Return charge (₹)</th></tr>
 <tr><td style="padding:4px"><b>City</b><div class="mute" style="font-size:12px">Hyderabad and Secunderabad</div></td><td style="padding:4px"><input id="gfl" type="number" min="0" value="${SET.fl??40}"></td><td style="padding:4px"><input id="gxl" type="number" min="0" value="${SET.xl??899}"></td><td style="padding:4px"><input id="grl" type="number" min="0" value="${SET.rl??0}"></td></tr>
 <tr><td style="padding:4px"><b>Rest of Telangana</b></td><td style="padding:4px"><input id="gfs" type="number" min="0" value="${SET.fs??60}"></td><td style="padding:4px"><input id="gxs" type="number" min="0" value="${SET.xs??1200}"></td><td style="padding:4px"><input id="grs" type="number" min="0" value="${SET.rs??0}"></td></tr>
 <tr><td style="padding:4px"><b>Rest of India</b></td><td style="padding:4px"><input id="gfo" type="number" min="0" value="${SET.fo??60}"></td><td style="padding:4px"><input id="gxo" type="number" min="0" value="${SET.xo??1200}"></td><td style="padding:4px"><input id="gro" type="number" min="0" value="${SET.ro??0}"></td></tr></table></div>
 <p class="mute" style="margin:6px 0">0 in "Customer pays" means free delivery. 0 in "Free above" means never free. The return charge kept is never less than the delivery charge the customer already paid. 0 in "Return charge" means only that is kept.</p>
 <p class="mute" id="gpcn" style="margin:4px 0;color:#b45309"></p>
 <div class="g2"><div><label>Your courier cost per order (₹, only used for "what you keep")</label><input id="gc" type="number" min="0" value="${SET.ccost}"></div></div>
 <details style="margin-top:10px"><summary style="cursor:pointer;font-weight:700">More courier options (usually not needed)</summary>
 <div style="margin-top:8px"><label style="display:flex;gap:8px;align-items:center;font-weight:700"><input type="checkbox" id="gz" style="width:auto" ${Number(SET.zon)?"checked":""}> Charge delivery by area (recommended, keep it ON)</label>
 <p class="mute" style="margin:4px 0 8px">When this is OFF, the table above is not used. The flat charge, free-delivery amount and order-value rows below are used instead.</p>
 <div class="g2"><div><label>Charge a % of the cart value instead of a flat charge (0 = flat charge from the table)</label><input id="gpc" type="number" min="0" max="100" value="${SET.pc??10}"></div><div></div>
 <div><label>City: highest charge when % is used (₹)</label><input id="ggl" type="number" min="0" value="${SET.gl??70}"></div><div><label>Rest of Telangana: highest charge (₹)</label><input id="ggs" type="number" min="0" value="${SET.gs??78}"></div><div><label>Rest of India: highest charge (₹)</label><input id="ggo" type="number" min="0" value="${SET.go??78}"></div></div>
 <label>City pincodes start with (comma separated)</label><input id="gzc" value="${esc(SET.zcity??"5000,50010")}"><label>State pincodes start with</label><input id="gzs" value="${esc(SET.zstate??"50")}">
 <p class="mute" style="margin:4px 0 0">Example: city <b>5000,50010</b> covers 500001 to 500109 (Hyderabad and Secunderabad); state <b>50</b> covers all Telangana. Everything else is "Rest of India".</p>
 <div class="g2" style="margin-top:8px"><div><label>Flat delivery charge when area charges are OFF (₹, 0 = free)</label><input id="gf" type="number" min="0" value="${SET.fee}"></div><div><label>Free delivery on orders of ₹ or more when OFF (0 = never)</label><input id="gr" type="number" min="0" value="${SET.free}"></div></div>
 <label>Delivery charge by order value (optional)</label><textarea id="gsl" rows="3" placeholder="499:60&#10;999:40&#10;1999:20">${esc(String(SET.slabs||"").split(",").filter(Boolean).join("\n"))}</textarea><p class="mute">One row per line: <b>order amount : charge</b>. Example: <b>499:60</b> means orders up to ₹499 pay ₹60; <b>999:40</b> means orders from ₹500 to ₹999 pay ₹40. Orders above the last row pay the "Delivery charge" above. "Free delivery" still wins. Leave empty to charge one flat amount. The amount is the item total before any coupon.</p></div></details></div>
 <div class="box"><b>Delivery time shown on the product page</b>
 <p class="mute" style="margin:0 0 8px">The customer's pincode is compared with the shop's pickup pincode (products with no shop pincode use the PickSmart dispatch pincode). Write the fewest and most days; use the same number twice for one fixed day.</p>
 <div class="g2"><div><label>Same pincode: from (days)</label><input id="gd0a" type="number" min="1" max="30" value="${SET.d0a??1}"></div><div><label>to (days)</label><input id="gd0b" type="number" min="1" max="30" value="${SET.d0b??1}"></div>
 <div><label>Same area (first 3 digits match): from</label><input id="gd1a" type="number" min="1" max="30" value="${SET.d1a??2}"></div><div><label>to</label><input id="gd1b" type="number" min="1" max="30" value="${SET.d1b??2}"></div>
 <div><label>Same region (first 2 digits match): from</label><input id="gd2a" type="number" min="1" max="30" value="${SET.d2a??2}"></div><div><label>to</label><input id="gd2b" type="number" min="1" max="30" value="${SET.d2b??4}"></div>
 <div><label>Rest of India: from</label><input id="gd3a" type="number" min="1" max="30" value="${SET.d3a??4}"></div><div><label>to</label><input id="gd3b" type="number" min="1" max="30" value="${SET.d3b??7}"></div></div>
 <label>PickSmart dispatch pincode (for products with no shop pincode)</label><input id="ghp" inputmode="numeric" maxlength="6" value="${esc(SET.hpin??"500045")}">
 </div>
 <div class="box"><b>Returns</b><label style="margin-top:10px">Non-returnable categories (one per line)</label><textarea id="gnrc" rows="3" placeholder="Beauty &amp; Personal Care&#10;Food &amp; Grocery">${esc(String(SET.nrc||"").split("|").join("\n"))}</textarea><p class="mute" style="margin:2px 0 0;font-size:12.5px">Every product in these categories is treated as "no return for change of mind", whatever its own setting. A top-level name covers its sub-categories. Damaged, defective or wrong items can still be reported within 3 days.</p>
 </div>
 <div class="box"><b>Product pictures</b>
 <label>Seconds each picture or video stays on screen (0 = no auto-rotate)</label><input id="grt" type="number" min="0" max="30" value="${SET.rot??4}">
 </div>
 <div class="box"><b>Orders and delivery area</b><p class="mute">Unpaid orders are cancelled automatically and the stock goes back. Orders where the customer already tapped "I have paid" are never cancelled automatically.</p>

 s.innerHTML=`<div class="tabs"><button class="chip${RP==="open"?" on":""}" data-f="open">Open</button><button class="chip${RP==="done"?" on":""}" data-f="done">Done</button></div>`+(l.length?l.map(r=>`<div class="box"><div class="row"><b style="flex:1">${esc(r.title||"(deleted product)")}</b><span class="k">${esc(RSN[r.reason]||r.reason)}</span>${r.pstatus==="rejected"?'<span class="k returned">Hidden</span>':""}</div><p class="mute" style="margin:4px 0">${esc(r.shop||"PickSmart")} · ${new Date(r.created_at).toLocaleDateString("en-IN")}${r.who?" · "+esc(r.who):""}${r.status==="open"&&r.open_n>1?" · "+r.open_n+" open reports on this product":""}</p>${r.note?`<p style="margin:4px 0">${esc(r.note)}</p>`:""}<div class="row">${r.status==="open"?`<button class="btn d" data-a="hide" data-i="${r.id}">Hide product</button><button class="btn s" data-a="dismiss" data-i="${r.id}">Dismiss</button>`:`<button class="btn s" data-a="reopen" data-i="${r.id}">Reopen</button>`}</div></div>`).join(""):'<p class="mute">No reports.</p>');
 s.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{RP=b.dataset.f;reports()});
 s.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{if(b.dataset.a==="hide"&&!confirm("Hide this product from the shop? The owner will see it as rejected with a note."))return;try{await post("/api/shop/admin/report",{id:+b.dataset.i,action:b.dataset.a});reports()}catch(e){alert(e.message)}})}
async function sellCount(){try{const l=await jf("/api/shop/admin/sellreqs"),n=l.filter(x=>!x.done&&!x.declined).length;$("#srn").textContent=n?"("+n+")":""}catch(e){}}
async function sellreqs(){const s=$("#w");s.innerHTML='<p class="mute">Loading…</p>';let L;try{L=await jf("/api/shop/admin/sellreqs")}catch(e){s.innerHTML='<p class="er">'+esc(e.message)+'</p>';return}
 const rw=(k,v)=>v?`<div class="row" style="padding:2px 0"><span class="mute" style="min-width:120px">${k}</span><span style="flex:1;word-break:break-word">${v}</span></div>`:"";
 s.innerHTML=`<div class="box"><b>Shop requests</b><p class="mute" style="margin:4px 0 0">Shops that filled in "Sell on PickSmart" on the website. Tap <b>Create shop</b> and the shop owner account is made with all these details. A password is made from their name, the login details are emailed to them and the request is removed from this list (edit the shop later in Shop owners). Tap <b>Decline</b> for spam or wrong requests (nothing is sent to them).</p></div><div id="sr-res"></div>`+(L.length?`<div class="row" style="gap:10px;align-items:center;margin:6px 0"><label><input type="checkbox" id="sr-all" style="width:20px;height:20px"> Select all</label><button class="btn s" id="sr-del" disabled>Delete selected</button></div>`:"")+(L.length?L.map(r=>`<div class="box" data-sr="${r.id}" style="${r.done||r.declined?"opacity:.7":""}"><div class="row" style="align-items:center;gap:8px;flex-wrap:wrap"><input type="checkbox" class="srk" data-k="${r.id}" style="width:20px;height:20px"><b style="flex:1;min-width:160px;font-size:16px">${esc(r.shop||"(no name)")} <span class="k">${esc(r.rid)}</span>${r.declined?' <span class="k returned">Declined</span>':r.done?' <span class="k paid">Done</span>':' <span class="k">New</span>'}${r.registered?' <span class="k returned">Already a shop</span>':""}</b><span class="mute">${new Date(r.created_at).toLocaleString("en-IN")}</span></div>
 ${rw("Owner",esc(r.owner))}${rw("Mobile / WhatsApp",esc(r.mobile))}${rw("Email",esc(r.email))}${rw("Shop phone",esc(r.shop_phone))}${rw("Pickup address",esc(r.address))}${rw("Area",esc(r.area))}${rw("City / pincode",esc((r.city+" "+r.pincode).trim()))}${rw("Google Maps",r.maps?`<a href="${esc(r.maps)}" target="_blank" rel="noopener">${esc(r.maps)}</a>`:"")}${rw("GST",esc(r.gst))}${rw("Sells",esc(r.sells))}${rw("Approx products",esc(r.count))}${rw("UPI ID",esc(r.upi))}${rw("Note",esc(r.note))}
 <div class="row" style="gap:8px;margin-top:8px;flex-wrap:wrap">${r.done||r.declined?`<button class="btn s" data-dn="${r.id}" data-v="0">Reopen</button>`:`${r.registered?"":`<button class="btn" data-ap="${r.id}">Create shop</button>`}<button class="btn s" data-dc="${r.id}">Decline</button>`}</div></div>`).join(""):'<p class="mute">No shop requests yet.</p>');
 s.querySelectorAll("[data-ap]").forEach(b=>b.onclick=async()=>{const r=L.find(x=>x.id===+b.dataset.ap);b.disabled=true;try{const d=await post("/api/shop/admin/sellreq/approve",{id:r.id});const t=`PickSmart shop owner login\nShop ID: ${d.code}\nEmail: ${d.email}\n${d.existing?"Password: (their existing PickSmart password)":"Password: "+d.password}\nLog in: https://pick-smart.in/?owner=1#/account\nYour orders and products: https://pick-smart.in/shop/owner`;await sellreqs();sellCount();$("#sr-res").innerHTML=`<div class="box" style="border-color:var(--ok)"><b class="ok">Shop created. Shop ID ${esc(d.code)}</b><p class="mute">${d.emailed?"✓ The login details were emailed to "+esc(d.email)+".":"The email could not be sent. Copy the details below and send them yourself."}</p><p class="mute" style="white-space:pre-line">${esc(t)}</p><button class="btn s" id="sr-cc">Copy login details</button></div>`;$("#sr-cc").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>{$("#sr-cc").textContent="Copied"}).catch(()=>{})};window.scrollTo(0,0)}catch(x){alert(x.message);b.disabled=false}});
 const sk=()=>[...s.querySelectorAll(".srk:checked")].map(x=>+x.dataset.k),up=()=>{const n=sk().length,d=$("#sr-del");if(d){d.disabled=!n;d.textContent=n?"Delete selected ("+n+")":"Delete selected"}};
 s.querySelectorAll(".srk").forEach(c=>c.onchange=up);if($("#sr-all"))$("#sr-all").onchange=e=>{s.querySelectorAll(".srk").forEach(c=>c.checked=e.target.checked);up()};
 if($("#sr-del"))$("#sr-del").onclick=async()=>{const ids=sk();if(!ids.length||!confirm("Delete "+ids.length+" request"+(ids.length>1?"s":"")+" completely? This cannot be undone."))return;try{await post("/api/shop/admin/sellreq/delete",{ids});sellreqs();sellCount()}catch(x){alert(x.message)}};
 s.querySelectorAll("[data-dc]").forEach(b=>b.onclick=async()=>{const r=L.find(x=>x.id===+b.dataset.dc);if(!confirm(`Decline the request from ${r.shop}? Nothing is sent to them.`))return;try{await post("/api/shop/admin/sellreq/decline",{id:r.id});sellreqs();sellCount()}catch(x){alert(x.message)}});
 s.querySelectorAll("[data-dn]").forEach(b=>b.onclick=async()=>{try{await post("/api/shop/admin/sellreq/done",{id:+b.dataset.dn,done:b.dataset.v==="1"});sellreqs();sellCount()}catch(x){alert(x.message)}})}
async function reportCount(){try{const l=await jf("/api/shop/admin/reports?status=open");$("#rpn").textContent=l.length?"("+l.length+")":""}catch(e){}}
let CQ="";
async function customers(){const s=$("#u");s.innerHTML='<p class="mute">Loading…</p>';let l;try{l=await jf("/api/shop/admin/customers?q="+encodeURIComponent(CQ))}catch(e){s.innerHTML='<p class="er">'+esc(e.message)+"</p>";return}
 s.innerHTML=`<div class="row" style="margin-bottom:8px"><input id="cq" placeholder="Search name, phone or email" value="${esc(CQ)}" style="flex:1"><button class="btn s" id="cg">Search</button><a class="chip" href="/api/shop/admin/export?kind=customers" download>Download all (Excel/CSV)</a></div>`+(l.length?l.map(c=>`<div class="box"><div class="row"><b style="flex:1">${esc(c.name||"")} · <a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></b>${c.blocked?'<span class="k returned">Blocked</span>':""}</div><p class="mute" style="margin:4px 0">${esc(c.email||"No email")} · ${c.orders} order${c.orders===1?"":"s"}${c.unpaid?" · "+c.unpaid+" unpaid":""}${c.bad?" · "+c.bad+" cancelled or returned":""} · last ${new Date(c.last_at).toLocaleDateString("en-IN")}</p><button class="btn ${c.blocked?"":"d"}" data-ph="${esc(c.phone)}" data-u="${c.user_id||""}" data-b="${c.blocked?0:1}" data-n="${esc(c.name||"")}">${c.blocked?"Unblock":"Block"}</button></div>`).join(""):'<p class="mute">No customers found.</p>');
 const go=()=>{CQ=$("#cq").value.trim();customers()};$("#cg").onclick=go;$("#cq").onkeydown=e=>{if(e.key==="Enter")go()};
 s.querySelectorAll("[data-b]").forEach(b=>b.onclick=async()=>{const on=b.dataset.b==="1";if(on&&!confirm("Block "+b.dataset.n+" ("+b.dataset.ph+")? They cannot place new orders. Their orders stay here."))return;try{await post("/api/shop/admin/customer/block",{phone:b.dataset.ph,user_id:+b.dataset.u||null,blocked:on});customers()}catch(e){alert(e.message)}})}
reportCount();sellCount();
/* ---- pay shops: product-wise totals, mark paid, download ---- */
let PY="unpaid";
async function payouts(){const s=$("#y");s.innerHTML='<p class="mute">Loading…</p>';let rows;try{rows=await jf("/api/shop/admin/payouts")}catch(e){s.innerHTML='<p class="er">'+esc(e.message)+"</p>";return}
 const shown=rows.filter(o=>PY==="all"||(PY==="paid"?o.shop_paid:!o.shop_paid)),by={};
 shown.forEach(o=>{(by[o.owner_id]=by[o.owner_id]||{id:o.owner_id,name:o.shop,orders:[]}).orders.push(o)});
 const day=864e5,ready=o=>!!o.ready,dt=t=>t?new Date(t).toLocaleDateString("en-IN",{day:"numeric",month:"short"}):"";
 const groups=Object.values(by),totalAll=shown.filter(ready).reduce((a,o)=>a+o.shop_price*o.qty,0),holdAll=shown.filter(o=>!ready(o)).reduce((a,o)=>a+o.shop_price*o.qty,0);
 s.innerHTML=`<div class="box"><div class="row"><b>Pay shops</b><a class="chip" href="/api/shop/admin/export?kind=payouts&unpaid=1" download>Download unpaid (Excel/CSV)</a><a class="chip" href="/api/shop/admin/export?kind=payouts" download>Download all</a><select id="pyf" style="width:auto"><option value="unpaid"${PY==="unpaid"?" selected":""}>Not paid yet</option><option value="paid"${PY==="paid"?" selected":""}>Paid</option><option value="all"${PY==="all"?" selected":""}>All delivered</option></select><span class="sp"></span><button class="btn s" id="pydl">Download Excel</button></div><p class="mute" style="margin:6px 0 0">A shop becomes payable only after the customer's return window is over (3 days after delivery) and no return request is open. Returned orders are never counted. Amount = the shop price × quantity. Courier costs are not taken off here: you pay them from the delivery charge and your margin. ${PY==="unpaid"?"<br>Ready to pay now: <b>"+inr(totalAll)+"</b>"+(holdAll?" · On hold: <b>"+inr(holdAll)+"</b>":""):""}</p></div>`+
 (groups.length?groups.map(g=>{const tot=g.orders.reduce((a,o)=>a+o.shop_price*o.qty,0),pr={};g.orders.forEach(o=>{const k=o.title+"|"+(o.option||"")+"|"+o.shop_price;(pr[k]=pr[k]||{t:o.title,op:o.option,p:o.shop_price,q:0}).q+=o.qty});
  const hold=g.orders.filter(o=>!ready(o)).length,rdy=g.orders.filter(o=>ready(o)),rtot=rdy.reduce((a,o)=>a+o.shop_price*o.qty,0);
  return `<div class="box" data-g="${g.id}"><div class="row"><b>${esc(g.name||"Shop")}</b><span class="k">${sc(g.id)}</span><span class="sp"></span><b style="font-size:18px">${inr(tot)}</b></div>
  <table style="width:100%;border-collapse:collapse;margin:8px 0;font-size:14px"><tr class="mute"><td>Product</td><td align="right">Qty</td><td align="right">Price</td><td align="right">Amount</td></tr>${Object.values(pr).map(x=>`<tr style="border-top:1px solid var(--line)"><td>${esc(x.t)}${x.op?" · "+esc(x.op):""}</td><td align="right">${x.q}</td><td align="right">${inr(x.p)}</td><td align="right">${inr(x.p*x.q)}</td></tr>`).join("")}<tr style="border-top:2px solid var(--line)"><td colspan="3"><b>Total</b></td><td align="right"><b>${inr(tot)}</b></td></tr></table>
  <details><summary class="mute">Order by order (${g.orders.length})</summary>${g.orders.map(o=>`<label style="display:flex;gap:8px;align-items:center;font-weight:400;margin:4px 0"><input type="checkbox" data-po="${o.id}" ${o.shop_paid?"checked":""}${!o.shop_paid&&!ready(o)?" disabled":""} style="width:auto"> <span>${esc(o.code)} · ${esc(o.title)}${o.option?" · "+esc(o.option):""} × ${o.qty} = ${inr(o.shop_price*o.qty)} <span class="mute">· delivered ${dt(o.delivered_at)}${o.shop_paid||ready(o)?"":o.hold_return?" · return requested: on hold":" · on hold until "+dt(o.pay_on)}</span></span></label>`).join("")}</details>
  <div class="row" style="margin-top:8px">${PY==="paid"?`<button class="btn s" data-un="${g.id}">Mark all as not paid</button>`:`<button class="btn" data-pay="${g.id}"${rdy.length?"":" disabled"}>Mark ${rdy.length} ready order${rdy.length===1?"":"s"} paid (${inr(rtot)})</button>`}${hold&&PY!=="paid"?`<span class="mute">${hold} on hold (return window still open)</span>`:""}</div></div>`}).join(""):'<p class="mute">Nothing here.</p>');
 $("#pyf").onchange=e=>{PY=e.target.value;payouts()};
 s.querySelectorAll("[data-po]").forEach(c=>c.onchange=async()=>{try{await post("/api/shop/admin/payouts/pay",{ids:[+c.dataset.po],paid:c.checked});payouts()}catch(e){alert(e.message);c.checked=!c.checked}});
 s.querySelectorAll("[data-pay],[data-un]").forEach(b=>b.onclick=async()=>{const id=+(b.dataset.pay||b.dataset.un),g=by[id],use=b.dataset.pay?g.orders.filter(ready):g.orders;if(b.dataset.pay&&!confirm("Mark "+use.length+" ready order"+(use.length===1?"":"s")+" as paid to "+(g.name||"this shop")+"?"))return;try{await post("/api/shop/admin/payouts/pay",{ids:use.map(o=>o.id),paid:!!b.dataset.pay});payouts()}catch(e){alert(e.message)}});
 $("#pydl").onclick=()=>{if(!window.XLSX)return alert("Spreadsheet tool not loaded. Reload and try again.");
  const wb=XLSX.utils.book_new(),pw=[];groups.forEach(g=>{const pr={};g.orders.forEach(o=>{const k=o.title+"|"+(o.option||"")+"|"+o.shop_price;(pr[k]=pr[k]||{t:o.title,op:o.option,p:o.shop_price,q:0}).q+=o.qty});Object.values(pr).forEach(x=>pw.push({shop_id:sc(g.id),shop:g.name||"",product:x.t,option:x.op||"",qty:x.q,shop_price:x.p,amount:x.p*x.q}));pw.push({shop_id:sc(g.id),shop:g.name||"",product:"TOTAL",amount:g.orders.reduce((a,o)=>a+o.shop_price*o.qty,0)})});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(pw),"Product wise");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(shown.map(o=>({shop_id:sc(o.owner_id),shop:o.shop||"",order:o.code,product:o.title,option:o.option||"",qty:o.qty,shop_price:o.shop_price,amount:o.shop_price*o.qty,delivered:dt(o.delivered_at),paid:o.shop_paid?"Yes":"No"}))),"Order wise");
  XLSX.writeFile(wb,"shop-payments-"+PY+".xlsx")}}

/* ---- bulk photos and videos: file names start with the product code ---- */
async function bulkMedia(){try{await load()}catch(e){}
 $("#m").innerHTML=`<div class="box"><b>Upload many photos and videos at once</b><p class="mute">Name each file with the product code (SKU) first, then anything you like. Example for product <b>K001</b>: <b>K001-front.jpg</b>, <b>K001-2.jpg</b>, <b>K001-video.mp4</b>. Select all files together. Up to 8 photos and 1 video per product.${CFG.video?"":" <b>Videos are off until the R2 bucket is connected.</b>"}</p>
 <input type="file" id="bf" multiple accept="image/jpeg,image/png,image/webp,video/mp4,video/webm"><div id="br"></div></div>`;
 $("#bf").onchange=async e=>{const fs=[...e.target.files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true})),r=$("#br"),by={};(await allProducts()).forEach(p=>{if(p.sku)by[p.sku.toLowerCase()]=p});
  const plan=[],miss=[];for(const f of fs){const base=f.name.replace(/\.[^.]+$/,""),sku=Object.keys(by).filter(k=>base.toLowerCase()===k||base.toLowerCase().startsWith(k)&&/[^a-z0-9]/i.test(base.charAt(k.length))).sort((a,b)=>b.length-a.length)[0];if(sku)plan.push([by[sku],f]);else miss.push(f.name)}
  r.innerHTML=`<p>${plan.length} files matched to products${miss.length?`, <span class="er">${miss.length} not matched</span>`:""}.</p>${miss.length?`<p class="mute">No product code found in: ${esc(miss.slice(0,10).join(", "))}${miss.length>10?"…":""}</p>`:""}${plan.length?'<button class="btn" id="bgo">Upload matched files</button><div id="bl" class="mute" style="margin-top:8px"></div>':""}`;
  if(plan.length)$("#bgo").onclick=async()=>{const b=$("#bgo");b.disabled=true;let ok=0,bad=[];for(let i=0;i<plan.length;i++){$("#bl").textContent=`Uploading ${i+1} of ${plan.length}…`;try{await upMedia(plan[i][0].id,plan[i][1]);ok++}catch(x){bad.push(plan[i][1].name+": "+x.message)}}
   $("#bl").innerHTML=`<span class="ok">${ok} uploaded.</span>`+(bad.length?`<br><span class="er">${esc(bad.join("\n"))}</span>`:"")}}}
(async()=>{try{CFG=await jf("/api/shop/config")}catch(e){}try{SET=await jf("/api/shop/admin/settings")}catch(e){}$("#mode").textContent=CFG.preview?"Preview mode: only you can see the shop":"Shop is live";orders();{const sel=()=>{const m=location.hash.match(/t=([a-z])/);if(!m)return;const b=document.querySelector('.tab[data-t="'+m[1]+'"]');if(b)b.click()};sel();addEventListener("hashchange",sel)}})();
